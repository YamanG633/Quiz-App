<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz App</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #43cea2, #185a9d);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .quiz-container {
    background: rgb(176, 219, 228);
    padding: 25px;
    width: 420px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(33, 28, 28, 0.2);
    text-align: center;
  }

  .info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .option {
    background: #d2d9db;
    margin: 8px 0;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }

  .option:hover {
    background: #efeded;
  }

  .correct {
    background: #4CAF50 !important;
    color: white;
  }

  .wrong {
    background: #f44336 !important;
    color: white;
  }

  button {
    margin-top: 15px;
    padding: 10px 22px;
    border: none;
    background: #185a9d;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    display: none;
  }

  button:hover {
    background: #0f3d6b;
  }
</style>
</head>
<body>

<div class="quiz-container">
  <div class="info">
    <span>⏱ Time: <span id="time">0</span>s</span>
    <span>📊 Score: <span id="score">0</span></span>
  </div>

  <h2 id="question"></h2>
  <div id="options"></div>

  <button id="nextBtn" onclick="nextQuestion()">Next</button>
  <p id="highScore"></p>
</div>

<script>
const quizData = [
  { question: "What does HTML stand for?",
    options: ["Hyper Text Markup Language", "High Text Machine Language", "Hyperlinks Text Mark Language", "None"],
    answer: 0 },
  { question: "Which language is used for styling?",
    options: ["HTML", "CSS", "Python", "Java"],
    answer: 1 },
  { question: "Which is a JavaScript framework?",
    options: ["Django", "React", "Laravel", "Flask"],
    answer: 1 },
  { question: "Which tag is used for images?",
    options: ["<img>", "<image>", "<pic>", "<src>"],
    answer: 0 },
  { question: "Which symbol is used for comments in JS?",
    options: ["//", "<!-- -->", "#", "**"],
    answer: 0 },
  { question: "What does CSS stand for?",
    options: ["Creative Style Sheets", "Cascading Style Sheets", "Colorful Style Sheets", "Computer Style Sheets"],
    answer: 1 },
  { question: "Which is not a programming language?",
    options: ["Java", "Python", "HTML", "C++"],
    answer: 2 },
  { question: "Which company created JavaScript?",
    options: ["Microsoft", "Google", "Netscape", "Apple"],
    answer: 2 },
  { question: "Which HTML tag is for links?",
    options: ["<a>", "<link>", "<href>", "<url>"],
    answer: 0 },
  { question: "Which is used for database?",
    options: ["MySQL", "HTML", "CSS", "Bootstrap"],
    answer: 0 }
];

let currentIndex = 0;
let score = 0;
let time = 0;
let answered = false;

const timeEl = document.getElementById("time");
const scoreEl = document.getElementById("score");
const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");
const highScoreEl = document.getElementById("highScore");

// Timer
setInterval(() => {
  time++;
  timeEl.textContent = time;
}, 1000);

function loadQuestion() {
  answered = false;
  nextBtn.style.display = "none";
  const q = quizData[currentIndex];
  questionEl.textContent = q.question;
  optionsEl.innerHTML = "";

  q.options.forEach((opt, index) => {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;
    div.onclick = () => selectAnswer(div, index);
    optionsEl.appendChild(div);
  });
}

function selectAnswer(element, index) {
  if (answered) return;
  answered = true;

  const correctIndex = quizData[currentIndex].answer;
  const options = document.querySelectorAll(".option");

  options.forEach((opt, i) => {
    if (i === correctIndex) opt.classList.add("correct");
    if (i === index && i !== correctIndex) opt.classList.add("wrong");
  });

  if (index === correctIndex) {
    score++;
    scoreEl.textContent = score;
  }

  nextBtn.style.display = "block";
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < quizData.length) {
    loadQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const highScore = localStorage.getItem("highScore") || 0;
  if (score > highScore) {
    localStorage.setItem("highScore", score);
  }

  questionEl.textContent = "🎉 Quiz Completed!";
  optionsEl.innerHTML = `
    <h3>Your Score: ${score}/10</h3>
    <h3>Your Time: ${time} seconds</h3>
  `;
  nextBtn.style.display = "none";
  highScoreEl.textContent = "🏆 High Score: " + localStorage.getItem("highScore");
}

loadQuestion();
highScoreEl.textContent = "🏆 High Score: " + (localStorage.getItem("highScore") || 0);
</script>

</body>
</html>
